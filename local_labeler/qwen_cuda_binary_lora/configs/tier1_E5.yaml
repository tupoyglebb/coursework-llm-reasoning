# CUDA / Tier 1 / E5 — ГЛУБИНА: num_layers 4 -> 24 (слои 12-35, заходит в середину).
#
# >>> НАСЛЕДОВАНИЕ: = конфиг победителя Tier 0 (T0*), изменён ТОЛЬКО num_layers. <<<
# На NVIDIA глубина дешевле, чем на Mac, но при OOM лестница та же: rank 32->16, затем max_seq_length 3072->2560.
model_id: Qwen/Qwen3-8B
data_dir: ./data_binary

learning_rate: 1.0e-4
lr_scheduler: cosine
warmup_steps: 50
lora:
  rank: 32                      # при OOM -> 16
  dropout: 0.05
  scale: 20.0

# --- ИЗУЧАЕМЫЙ ФАКТОР Tier 1 ---
num_layers: 24

batch_size: 1
grad_accumulation_steps: 8
iters: 1700
max_seq_length: 3072            # при OOM -> 2560
grad_checkpoint: true
mask_prompt: true
optim: paged_adamw_8bit
seed: 42
steps_per_report: 10
save_every: 100
save_total_limit: 6
adapter_path: ./adapters/tier1_E5

# Binary / Tier 0 / E6 — RANK 16 (ширина адаптера).
# База: конфиг победителя E3 (lr=1e-4, cosine, num_layers=36).
# Изучаемый фактор: rank 8 → 16, lora_alpha = 20 * 16 = 320.
#
# Мотивация: предыдущая серия показала, что rank=4 почти не уступает rank=8
# (0.7931 vs 0.7963). Мы на плоском участке кривой. Тест rank=16 проверяет,
# нужна ли бОльшая ёмкость адаптера для бинарной схемы или плато сохраняется.
model_id: Qwen/Qwen3-8B
data_dir: ./data_binary

learning_rate: 1.0e-4
lr_scheduler: cosine
warmup_steps: 0

# --- ИЗУЧАЕМЫЙ ФАКТОР: rank 8 → 16 ---
lora:
  rank: 16
  dropout: 0.05
  scale: 20.0                  # lora_alpha = 20 * 16 = 320

num_layers: 36
batch_size: 2
grad_accumulation_steps: 4
iters: 1700
max_seq_length: 3072
mask_prompt: true
optim: adamw_torch
seed: 42

steps_per_report: 10
save_every: 100
eval_every: 100
save_total_limit: 6
prompt_style: compact
val_max_new_tokens: 900

quantization: nf4
attn_implementation: flash_attention_2
gen_batch_size: 16
grad_checkpoint: false

adapter_path: ./adapters/tier0_E6

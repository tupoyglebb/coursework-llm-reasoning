# CUDA / Tier 1 / E4 — ГЛУБИНА: num_layers 4 -> 16 (слои 20-35).
#
# >>> НАСЛЕДОВАНИЕ: = конфиг победителя Tier 0 (T0*), изменён ТОЛЬКО num_layers. <<<
# Заполнено в предположении T0* = lr1e-4+cosine + rank32, без балансировки.
# Если победил E3 — data_dir: ./data_balanced и iters: 2500.
model_id: Qwen/Qwen3-8B
data_dir: ./data_binary

learning_rate: 1.0e-4
lr_scheduler: cosine
warmup_steps: 50
lora:
  rank: 32
  dropout: 0.05
  scale: 20.0

# --- ИЗУЧАЕМЫЙ ФАКТОР Tier 1 ---
num_layers: 16                  # E4: 16 ; E5: 24

batch_size: 1
grad_accumulation_steps: 8
iters: 1700
max_seq_length: 3072
grad_checkpoint: true
mask_prompt: true
optim: paged_adamw_8bit
seed: 42
steps_per_report: 10
save_every: 100
save_total_limit: 6
adapter_path: ./adapters/tier1_E4

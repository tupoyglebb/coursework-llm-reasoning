# Tier 1 / E5 — ГЛУБИНА: num_layers 4 -> 24 (слои 12-35, заходит в середину).
#
# >>> НАСЛЕДОВАНИЕ: = конфиг победителя Tier 0 (T0*), изменён ТОЛЬКО num_layers. <<<
# Заполнено в предположении T0* = lr1e-4+cosine + rank32, без балансировки. Подгоните под своего победителя.
#
# РИСК OOM (самый вероятный прогон серии). Лестница отката, если не влезает в 32 ГБ:
#   1) rank 32 -> 16   (дешевле всего, ранг уже изучен в Tier 0)
#   2) max_seq_length 3072 -> 2560
# Любой откат вводит второй изменившийся фактор -> отметить в выводах (сравнение E5<->E4 станет приблизительным).
model: ./models/qwen3-8b-4bit
train: true
test: true
data: ./data_mlx
fine_tune_type: lora
optimizer: adamw

learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 50
  arguments: [1.0e-4, 1650, 1.0e-6]
lora_parameters:
  rank: 32                    # при OOM -> 16
  dropout: 0.05
  scale: 20.0

# --- ИЗУЧАЕМЫЙ ФАКТОР Tier 1 ---
num_layers: 24

batch_size: 1
grad_accumulation_steps: 8
iters: 1700
max_seq_length: 3072          # при OOM -> 2560
grad_checkpoint: true
mask_prompt: true
seed: 42
steps_per_report: 10
steps_per_eval: 50
save_every: 100
val_batches: 50
test_batches: 25
adapter_path: ./adapters/tier1_E5

# Tier 0 / E0 — КОНТРОЛЬ. Старые гиперпараметры обучения на новой инфраструктуре.
# Меняет относительно прод-модели только: seq 4096->3072, iters под 2 эпохи.
# Зафиксированные константы здесь повторяются во всех E0..E3 (меняется по одному фактору).
model: ./models/qwen3-8b-4bit
train: true
test: true
data: ./data_mlx
fine_tune_type: lora
optimizer: adamw

# --- ИЗУЧАЕМЫЕ ФАКТОРЫ (в E0 = как у прод-модели) ---
learning_rate: 1.0e-5
lr_schedule: null            # E0: без расписания (константа)
lora_parameters:
  rank: 8                    # E0/E1: 8 ; E2: 32
  dropout: 0.05
  scale: 20.0

# --- ФИКСИРОВАННЫЕ КОНСТАНТЫ (одинаковы во всех Tier 0) ---
num_layers: 4                # Tier 0 НЕ трогает глубину (это Tier 1)
batch_size: 1
grad_accumulation_steps: 8   # эффективный батч = 8
iters: 1700                  # ~2 эпохи для 6767 train (6767/8*2≈1692). Если оставить 5544 -> 1400.
max_seq_length: 3072         # p95≈2660 ток.: усечения почти нет, память/время меньше
grad_checkpoint: true
mask_prompt: true
seed: 42
steps_per_report: 10
steps_per_eval: 50
save_every: 100
val_batches: 50
test_batches: 25
adapter_path: ./adapters/tier0_E0

# Tier 1 / E4 — ГЛУБИНА: num_layers 4 -> 16 (слои 20-35).
#
# >>> НАСЛЕДОВАНИЕ: этот файл = конфиг победителя Tier 0 (T0*), где изменён ТОЛЬКО num_layers. <<<
# Ниже он заполнен в предположении T0* = lr1e-4+cosine + rank32, БЕЗ балансировки данных.
# Если ваш победитель Tier 0 другой — скопируйте его yaml и поменяйте ровно одну строку: num_layers: 16.
# (Если победил E3/балансировка: data -> ./data_mlx_balanced и iters -> 2500.)
model: ./models/qwen3-8b-4bit
train: true
test: true
data: ./data_mlx              # из T0* (если победил E3 -> ./data_mlx_balanced)
fine_tune_type: lora
optimizer: adamw

learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 50
  arguments: [1.0e-4, 1650, 1.0e-6]
lora_parameters:
  rank: 32
  dropout: 0.05
  scale: 20.0

# --- ИЗУЧАЕМЫЙ ФАКТОР Tier 1 ---
num_layers: 16                # E4: 16 ; E5: 24

batch_size: 1
grad_accumulation_steps: 8
iters: 1700                   # = 2 эпохи набора T0* (1700 для 6767; 2500 если балансированный)
max_seq_length: 3072
grad_checkpoint: true
mask_prompt: true
seed: 42
steps_per_report: 10
steps_per_eval: 50
save_every: 100
val_batches: 50
test_batches: 25
adapter_path: ./adapters/tier1_E4

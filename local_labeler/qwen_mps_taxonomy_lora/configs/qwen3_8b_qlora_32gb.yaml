# MLX-LM QLoRA config for 32 GB Apple Silicon.
# Effective batch size = batch_size * grad_accumulation_steps = 8.
# iters=1125 is roughly one epoch for 9000 train rows with effective batch 8.

model: ./models/qwen3-8b-4bit
train: true
test: true
data: ./data_mlx
fine_tune_type: lora
optimizer: adamw
num_layers: 4
batch_size: 1
grad_accumulation_steps: 8
iters: 1125
learning_rate: 1e-5
max_seq_length: 4096
val_batches: 25
test_batches: 25
steps_per_report: 10
steps_per_eval: 100
save_every: 100
adapter_path: ./adapters/taxonomy_qwen3_8b
mask_prompt: true
grad_checkpoint: true
seed: 42
lora_parameters:
  rank: 8
  dropout: 0.05
  scale: 20.0

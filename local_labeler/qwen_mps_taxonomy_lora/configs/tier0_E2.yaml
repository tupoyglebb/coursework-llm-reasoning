# Tier 0 / E2 — RANK 8 -> 32. Отличие от E1 (победителя): только rank. scale держим = 20.
model: ./models/qwen3-8b-4bit
train: true
test: true
data: ./data_mlx
fine_tune_type: lora
optimizer: adamw

learning_rate: 1.0e-4         # унаследовано от E1
lr_schedule:
  name: cosine_decay
  warmup: 50
  arguments: [1.0e-4, 1650, 1.0e-6]

# --- ИЗУЧАЕМЫЙ ФАКТОР: rank 8 -> 32 ---
lora_parameters:
  rank: 32
  dropout: 0.05
  scale: 20.0                 # НЕ меняем (изолируем эффект ранга)

# --- ФИКСИРОВАННЫЕ КОНСТАНТЫ ---
num_layers: 4
batch_size: 1
grad_accumulation_steps: 8
iters: 1700
max_seq_length: 3072
grad_checkpoint: true
mask_prompt: true
seed: 42
steps_per_report: 10
steps_per_eval: 50
save_every: 100
val_batches: 50
test_batches: 25
adapter_path: ./adapters/tier0_E2

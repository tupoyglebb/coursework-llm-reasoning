# Tier 0 / E3 — OVERSAMPLING редких классов. Отличие от победителя E1/E2: только данные.
#
# ВАЖНО (наследование): этот файл собран в предположении, что победитель = E2 (rank 32).
# Если победил E1 (rank 8) — поменяйте rank на 8. Меняем ОДИН фактор (данные), остальное = от победителя.
#
# Данные: ./data_mlx_balanced создаётся скриптом scripts/oversample_train.py из ./data_mlx
# (балансируется только train.jsonl; valid/test копируются без изменений).
model: ./models/qwen3-8b-4bit
train: true
test: true
data: ./data_mlx_balanced     # <-- ИЗУЧАЕМЫЙ ФАКТОР: перебалансированный train
fine_tune_type: lora
optimizer: adamw

learning_rate: 1.0e-4         # от победителя (E2)
lr_schedule:
  name: cosine_decay
  warmup: 50
  arguments: [1.0e-4, 2450, 1.0e-6]   # decay_steps под ~2 эпохи раздутого набора
lora_parameters:
  rank: 32                    # от победителя (E2). Если победил E1 -> 8.
  dropout: 0.05
  scale: 20.0

num_layers: 4
batch_size: 1
grad_accumulation_steps: 8
iters: 2500                   # ~2 эпохи балансированного train (~10150 строк при inflate=1.5)
max_seq_length: 3072
grad_checkpoint: true
mask_prompt: true
seed: 42
steps_per_report: 10
steps_per_eval: 50
save_every: 100
val_batches: 50
test_batches: 25
adapter_path: ./adapters/tier0_E3
